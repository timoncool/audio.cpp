name: Studio streamed MIDI on the released server
on:
  push:
    branches: [qa/muscriptor-stream-release]
permissions:
  contents: read
jobs:
  music:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Transcribe with the released CPU package
        run: |
          curl -fsSL --retry 3 https://github.com/timoncool/audio.cpp/releases/download/server-31cb1a4a/audiocpp-server-linux-cpu-x64.tar.gz -o released.tgz
          echo 'c8a6746c616711b3543a776c04e2de21a9d84cd1a2a522470e467a55f4032401  released.tgz' | sha256sum -c
          mkdir released && tar -xzf released.tgz -C released
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fluidsynth fluid-soundfont-gm
          python3 .github/check_muscriptor.py released
      - name: Verify the exact piano reference used for GPU comparisons
        run: echo '8388e54e7255f3e5c940754c09986c6cdfc90f2dc4990748047e9248c62e7cba  fixtures/piano.wav' | sha256sum -c
      - uses: actions/upload-artifact@v4
        with:
          name: muscriptor-reference-piano
          path: |
            fixtures/piano.wav
            fixtures/released-notes.json
          if-no-files-found: error
          retention-days: 7
