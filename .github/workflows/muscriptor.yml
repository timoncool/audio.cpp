name: Compare MuScriptor reference on two piano recordings
on:
  push:
    branches: [qa/muscriptor-python-reference]
permissions:
  contents: read
jobs:
  music:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: muscriptor/muscriptor
          ref: 68456b17da8eea651eee6084c104611089810231
          path: reference
      - name: Prepare CPU inference and reference piano
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fluidsynth fluid-soundfont-gm libsndfile1 ffmpeg
          python3 -m venv venv
          venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          venv/bin/pip install ./reference
      - name: Transcribe the same WAVs and original weights with upstream PyTorch
        run: venv/bin/python .github/check_muscriptor.py reference
